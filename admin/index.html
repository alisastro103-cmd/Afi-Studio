<!doctype html>
<html lang="id" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afi Studio — Admin Panel</title>
<link rel="icon" type="image/png" href="/admin/favicon.png">
<link rel="stylesheet" href="/admin/dist/output.css">
<link rel="stylesheet" href="/admin/fonts/fonts.css">
<script src="/admin/icons/lucide-local.js"></script>
<script>
  var saved = localStorage.getItem('afi-theme');
  var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark', isDark);
  document.documentElement.classList.toggle('view-grid', localStorage.getItem('afi-view') !== 'table');
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'DM Sans', sans-serif; overflow-x: hidden; }
  html { zoom: 0.85; }
  h1,h2,h3,h4 { font-family: 'Outfit', sans-serif; }
  :root {
    --accent: #93C5FD; --accent-hover: #7DD3FC; --bg: #D0D7E1; --surface: #E1E7EE;
    --text: #334155; --text-sub: #64748B; --border: #B9C4D3; --grid-line: rgba(100,116,139,0.22);
    --danger: #EF4444; --success: #22C55E;
  }
  .dark { --accent: #3B5578; --accent-hover: #4A6690; --bg: #1E293B; --surface: #334155; --text: #CBD5E1; --text-sub: #94A3B8; --border: #475569; --grid-line: rgba(148,163,184,0.16); }
  body { background-color: var(--bg); background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px); background-size: 32px 32px; color: var(--text); transition: background-color .3s, color .3s; }

  /* --- ANIMASI: buka halaman web, pindah halaman, board/popup muncul & tutup --- */
  @keyframes pageLoadIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  body { animation: pageLoadIn .45s ease; }

  @keyframes viewIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  .section-view.active { animation: viewIn .32s cubic-bezier(.16,1,.3,1); }

  @keyframes modalBgIn { from { opacity:0; } to { opacity:1; } }
  @keyframes modalBgOut { from { opacity:1; } to { opacity:0; } }
  @keyframes modalBoxIn { from { opacity:0; transform:scale(.94) translateY(12px); } to { opacity:1; transform:scale(1) translateY(0); } }
  @keyframes modalBoxOut { from { opacity:1; transform:scale(1) translateY(0); } to { opacity:0; transform:scale(.96) translateY(8px); } }

  @keyframes dropdownIn { from { opacity:0; transform:translateY(-6px) scale(.96); } to { opacity:1; transform:translateY(0) scale(1); } }
  @keyframes dropdownOut { from { opacity:1; transform:translateY(0) scale(1); } to { opacity:0; transform:translateY(-6px) scale(.96); } }

  @keyframes toastIn { from { opacity:0; transform:translateY(12px) scale(.97); } to { opacity:1; transform:translateY(0) scale(1); } }
  @keyframes toastOut { from { opacity:1; transform:translateY(0) scale(1); } to { opacity:0; transform:translateY(8px) scale(.97); } }

  .topbar { position: sticky; top:0; z-index: 40; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px); }
  #main-content { padding-top:10px; }
  /* --- Mode tabel: jarak ke navbar dibikin lebih rapat dibanding mode kotak --- */
  html:not(.view-grid) #main-content { padding-top:0; }
  html:not(.view-grid) .data-table-wrap { margin-top:0; }
  html:not(.view-grid) #main-content .mb-1 { margin-bottom:0; }
  .sidebar { background: var(--surface); width: 220px; flex-shrink:0; }
  .side-item { display:flex; align-items:center; gap:10px; padding:10px 16px; font-size:13.5px; font-weight:600; color: var(--text-sub); border-radius:8px; cursor:pointer; transition: all .15s; }
  .side-item:hover { background: var(--bg); color: var(--text); }
  .side-item.active { background: var(--accent); color:#fff; }
  .side-item svg { width:17px; height:17px; }

  .panel { background: var(--surface); border-radius:10px; }

  .btn { padding:8px 14px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; border:1px solid transparent; transition: all .15s; }
  .btn-accent { background: var(--accent); color:#fff; }
  .btn-accent:hover { background: var(--accent-hover); }
  .btn-outline { background: var(--bg); color: var(--text); }
  .btn-outline:hover { background: var(--border); }
  .btn-danger { background: var(--danger); color:#fff; }
  .btn-danger:hover { filter: brightness(1.1); }
  .btn-icon { width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:8px; border:none; background:transparent; color:var(--text-sub); cursor:pointer; }
  .btn-icon:hover { color: var(--accent); }
  .btn-icon svg { width:17px; height:17px; }
  .icon-btn-plain { display:flex; align-items:center; justify-content:center; width:38px; height:38px; background:none; border:none; color:var(--text-sub); cursor:pointer; padding:0; flex-shrink:0; }
  .icon-btn-plain:hover { color:var(--accent); }
  .icon-btn-plain svg { width:21px; height:21px; }

  /* --- Tombol tambah bulat (+) dipakai di semua halaman --- */
  .btn-add-circle { width:38px; height:38px; border-radius:999px; display:flex; align-items:center; justify-content:center; background:var(--accent); color:#fff; border:none; cursor:pointer; flex-shrink:0; transition: background .15s; }
  .btn-add-circle:hover { background: var(--accent-hover); }
  .btn-add-circle svg { width:18px; height:18px; }
  /* --- Tombol tambah (+) versi mengambang, tetap muncul di layar di semua halaman --- */
  .global-fab { position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); right:14px; z-index:70; display:none; align-items:center; gap:10px; }
  .global-fab.show { display:flex; }
  .global-fab .btn-add-circle { width:48px; height:48px; box-shadow:0 6px 18px rgba(0,0,0,.3); }
  .global-fab .btn-add-circle svg { width:21px; height:21px; }
  #gen-fab-btn { background:var(--surface); color:var(--text); border:1px solid var(--border); }
  #gen-fab-dropdown { padding:10px; min-width:170px; }
  /* --- Menu "Tambah Member / Gen Baru": tombol lebih besar & naik lebih jauh dari FAB, supaya tidak salah tekan di mobile --- */
  #global-fab-dropdown { min-width:205px; }
  #global-fab-dropdown button { padding:15px 16px; font-size:14px; gap:10px; }
  #global-fab-dropdown button svg { width:18px; height:18px; }

  input, textarea, select { background: var(--bg); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:9px 12px; font-size:13px; width:100%; outline:none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  /* --- Kolom teks di form: melebar mengikuti panjang isi saat diketik, biar seluruh teks kelihatan --- */
  .modal-box textarea, .modal-box input[type="text"], .modal-box input:not([type]) { transition: width .12s ease; }
  .modal-box textarea[wrap="off"] { white-space:pre; overflow-x:auto; overflow-y:hidden; }
  .modal-box textarea:not([wrap="off"]) { resize:none; overflow:hidden; }
  .gen-filter { border:none; width:auto; max-width:200px; height:38px; font-weight:700; cursor:pointer; }
  label { font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color: var(--text-sub); display:block; margin-bottom:5px; }

  /* --- Tabel: sembunyikan garis scrollbar bawaan browser, tapi tetap bisa discroll ke samping --- */
  .data-table-wrap { scrollbar-width:none; -ms-overflow-style:none; }
  .data-table-wrap::-webkit-scrollbar { display:none; height:0; }
  table { width:auto; border-collapse: collapse; font-size:12.5px; }
  th { text-align:center; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-sub); padding:9px 12px; white-space:nowrap; position:relative; border-bottom:1px solid color-mix(in srgb, var(--text-sub) 18%, transparent); }
  td { padding:10px 12px; vertical-align:middle; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-bottom:1px solid color-mix(in srgb, var(--text-sub) 10%, transparent); border-right:1px solid color-mix(in srgb, var(--text-sub) 10%, transparent); }
  tbody tr:last-child td { border-bottom:none; }
  /* --- Kolom bisa diatur lebar/jaraknya lewat tarik di pinggir header (tidak ada titik, cukup area tarik tipis) --- */
  .col-resizer { position:absolute; top:0; right:-5px; width:10px; height:100%; cursor:col-resize; z-index:5; touch-action:none; }
  .col-resizer:hover, .col-resizer.resizing { background: color-mix(in srgb, var(--accent) 45%, transparent); }
  /* --- Teks kolom: default satu baris + "..." (lebar kolom otomatis pas dengan isi lewat JS) --- */
  .desc-col { color:var(--text-sub); font-size:11px; }
  /* --- Lebar kolom sepenuhnya diatur lewat JS (initResizableTables), biar konsisten satu kolom sama rata --- */
  tbody tr:nth-child(even) { background: rgba(100,116,139,0.06); }
  .row-num { white-space:nowrap; text-align:center; color:var(--text-sub); font-weight:700; font-size:11px; }
  .chip { display:inline-block; font-size:10.5px; font-weight:700; background:var(--bg); padding:2px 8px; border-radius:999px; margin:1px 2px; }

  /* --- AKSI: dropdown untuk tombol tambah mengambang & popup tahan/klik-kanan --- */
  .action-menu { position:relative; display:inline-block; }
  .action-dropdown { display:none; position:absolute; right:0; top:calc(100% + 4px); background:var(--surface); border-radius:8px; min-width:132px; box-shadow:0 8px 24px rgba(0,0,0,.18); z-index:50; overflow:hidden; transform-origin: top right; }
  .action-dropdown.open { display:block; animation: dropdownIn .16s ease; }
  .action-dropdown.closing { display:block; animation: dropdownOut .14s ease forwards; }
  .action-dropdown button { width:100%; display:flex; align-items:center; gap:8px; padding:10px 12px; font-size:12.5px; font-weight:600; background:transparent; border:none; color:var(--text); cursor:pointer; text-align:left; }
  .action-dropdown button:hover { background:var(--bg); }
  .action-dropdown button.danger { color:#EF4444; }
  .action-dropdown button svg { width:14px; height:14px; flex-shrink:0; }

  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:80; display:flex; align-items:center; justify-content:center; padding:16px; animation: modalBgIn .18s ease; }
  .modal-bg.closing { animation: modalBgOut .16s ease forwards; }
  .modal-box { background: var(--surface); border-radius:12px; max-width:520px; width:100%; max-height:90vh; overflow-y:auto; padding:20px; animation: modalBoxIn .22s cubic-bezier(.16,1,.3,1); }
  .modal-bg.closing .modal-box { animation: modalBoxOut .16s ease forwards; }
  .juara-pill-group { display:flex; flex-wrap:wrap; gap:6px; }
  .juara-pill { position:relative; cursor:pointer; }
  .juara-pill input[type="radio"] { position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; }
  .juara-pill span { display:inline-block; padding:6px 12px; border:1px solid var(--border); border-radius:8px; font-size:12px; font-weight:700; color:var(--text-sub); background:var(--bg); transition: background .12s ease, color .12s ease, border-color .12s ease; }
  .juara-pill:has(input:checked) span { background:var(--accent); color:#fff; border-color:var(--accent); }

  /* --- RESPONSIVE SIDEBAR (mobile drawer, supaya tidak bertabrakan dengan konten) --- */
  .menu-toggle { display:none; width:42px; height:42px; align-items:center; justify-content:center; background:transparent; color:var(--text); cursor:pointer; flex-shrink:0; border:none; }
  .menu-toggle svg { width:23px; height:23px; }
  .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:65; }
  .sidebar-overlay.open { display:block; }
  @media (max-width: 860px) {
    .menu-toggle { display:flex; }
    .sidebar { position:fixed; top:0; left:0; height:100%; z-index:70; transform:translateX(-100%); transition:transform .25s ease; box-shadow:0 0 30px rgba(0,0,0,.25); }
    .sidebar.open { transform:translateX(0); }
    /* board tabel full-bleed: nempel ke ujung layar, scroll ke samping buat lihat data selengkapnya */
    .panel.overflow-x-auto { margin-left:-20px; margin-right:-20px; width:calc(100% + 40px); border-radius:0; }
    /* baris tabel dibikin sedikit lebih tinggi khusus di mobile, biar area sentuh tiap baris lebih lega */
    td { padding-top:16px; padding-bottom:16px; }
    /* tombol tambah (+) mengambang: diperbesar di mobile supaya lebih mudah dijangkau/ditekan jari */
    .global-fab { bottom:calc(22px + env(safe-area-inset-bottom)); right:16px; gap:12px; }
    .global-fab .btn-add-circle { width:58px; height:58px; }
    .global-fab .btn-add-circle svg { width:26px; height:26px; }
  }

  .section-view { display:none; }
  .section-view.active { display:block; }
  input.search-input { display:none; }
  input.search-input.open { display:block; }

  /* --- TOGGLE TAMPILAN: Tabel <-> Kotak (kartu database) --- */
  .data-grid { display:none; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap:12px; }
  html.view-grid .data-table-wrap { display:none; }
  html.view-grid .data-grid { display:grid; }
  .data-card { display:flex; flex-direction:column; gap:8px; }
  .data-card img { width:100%; object-fit:cover; border-radius:8px; background:var(--bg); }

  /* --- MARQUEE: kartu (mode blok), teks aja, aksinya lewat tahan-kartu --- */
  /* Pakai layout kolom (bukan grid baris) biar kartu pendek gak ninggalin ruang kosong di sebelah kartu panjang */
  html.view-grid #marquee-grid { display:block; column-width:190px; column-gap:12px; }
  html.view-grid #marquee-grid > div { display:inline-block; width:100%; margin:0 0 12px; break-inside:avoid; }
  .marquee-card-text { font-size:13px; word-break:break-word; }

  /* --- Tiruan board asli website (Models & Member), sebagai draf tampilan --- */
  .mimic-model-card { position:relative; border-radius:10px; overflow:hidden; background:var(--surface); }
  .mimic-model-card .thumb { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--bg); }
  .mimic-model-card .badge { position:absolute; top:8px; right:8px; background:var(--accent); color:#fff; font-size:.65rem; font-weight:700; padding:3px 8px; border-radius:999px; }
  .mimic-model-card .body { padding:12px; display:flex; flex-direction:column; gap:6px; }
  .mimic-model-card .title { font-weight:700; font-size:15px; }
  .mimic-model-card .caption { font-size:12px; color:var(--text-sub); line-height:1.4; }

  /* --- VIDEO & TUTORIAL: kartu (mode kotak), thumbnail full sama seperti Models --- */
  .video-card { position:relative; border-radius:10px; overflow:hidden; background:var(--surface); }
  .video-card .thumb { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--bg); }
  .video-card .body { padding:12px; display:flex; flex-direction:column; gap:6px; }
  .video-card .title { font-weight:700; font-size:13px; }
  .mimic-id-card { border-radius:10px; overflow:hidden; background:var(--surface); box-shadow:0 4px 6px rgba(0,0,0,.3); }
  .mimic-id-card .photo { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:var(--bg); }
  .mimic-id-card .namebar { background:var(--accent); padding:8px 2px; text-align:center; min-height:35px; display:flex; align-items:center; justify-content:center; }
  .mimic-id-card .namebar span { color:#fff; font-size:14px; font-weight:bold; line-height:1.1; }
  .mimic-id-card .meta { padding:10px 12px; display:flex; flex-direction:column; gap:6px; }

  /* --- RANKING RENDER: kartu (mode kotak), gambar full-bleed seperti Models & Member --- */
  .ranking-card { position:relative; border-radius:10px; overflow:hidden; background:var(--surface); }
  .ranking-card .photo { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:var(--bg); }
  .ranking-card .badge { position:absolute; top:8px; right:8px; background:var(--accent); color:#fff; font-size:.65rem; font-weight:700; padding:3px 8px; border-radius:999px; }
  .ranking-card .body { padding:12px; display:flex; flex-direction:column; gap:6px; }
  .ranking-card .title { font-weight:700; font-size:13px; }
  .ranking-card .caption { font-size:11px; color:var(--text-sub); line-height:1.4; }
  .toast { position:fixed; bottom:20px; right:20px; background:var(--success); color:#fff; padding:12px 18px; border-radius:8px; font-size:13px; font-weight:700; z-index:70; box-shadow:0 4px 14px rgba(0,0,0,.2); animation: toastIn .25s cubic-bezier(.16,1,.3,1); }
  .toast.closing { animation: toastOut .16s ease forwards; }

  /* --- Board opsi Edit/Hapus saat kartu (mode kotak) ditahan, ATAU baris tabel ditahan/klik kanan --- */
  [data-hold-edit] { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; cursor:pointer; transition: transform .15s, opacity .15s, background-color .15s; }
  [data-hold-edit].card-pressed { transform: scale(0.96); opacity: 0.7; }
  tr[data-hold-edit].card-pressed { transform:none; opacity:1; background: color-mix(in srgb, var(--accent) 22%, transparent); }
</style>
</head>
<body class="h-full">

<!-- ===== LOGIN GATE ===== -->
<!-- Halaman ini isinya cuma form login. Panel admin yang sebenarnya ada di
     panel.html dan file itu akan nolak nampilin apa pun kalau belum ada
     token valid, jadi walau URL panel.html diketik langsung tetap balik ke sini. -->
<div id="login-screen" style="position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; background:var(--bg); padding:20px;">
  <div style="width:100%; max-width:340px;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
      <div style="width:34px; height:34px; flex-shrink:0; border-radius:9px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Outfit',sans-serif; font-weight:800; font-size:16px;">A</div>
      <div style="font-family:'Outfit',sans-serif; font-weight:800; font-size:15px;">Afi Studio Admin</div>
    </div>
    <label style="font-size:12px; font-weight:700; color:var(--text-sub);">Token Admin</label>
    <input id="login-token-input" type="password" placeholder="Masukkan token admin" style="width:100%; margin-top:6px; margin-bottom:10px;" onkeydown="if(event.key==='Enter') doLogin()">
    <button class="btn btn-accent" style="width:100%;" onclick="doLogin()">Masuk</button>
    <div id="login-error" style="color:var(--danger); font-size:12px; font-weight:600; margin-top:10px; display:none;"></div>
  </div>
</div>

<script>
function getToken(){ return sessionStorage.getItem('afi-admin-token') || ''; }
function setToken(t){ sessionStorage.setItem('afi-admin-token', t); }
function clearToken(){ sessionStorage.removeItem('afi-admin-token'); }

async function doLogin(){
  const input = document.getElementById('login-token-input');
  const errEl = document.getElementById('login-error');
  const token = input.value.trim();
  errEl.style.display = 'none';
  if(!token){ errEl.textContent = 'Token wajib diisi.'; errEl.style.display = 'block'; return; }
  try{
    const res = await fetch('/api/admin/verify', { method:'POST', headers:{ 'x-admin-token': token } });
    const data = await res.json();
    if(res.ok && data.ok){
      setToken(token);
      window.location.href = '/admin/panel.html';
    } else {
      errEl.textContent = data.error || 'Token salah.';
      errEl.style.display = 'block';
    }
  }catch(e){
    errEl.textContent = 'Gagal menghubungi server. Cek koneksi internet.';
    errEl.style.display = 'block';
  }
}

// Kalau sesi token masih ada & valid (misal balik lagi dari panel), langsung
// lempar ke panel.html tanpa perlu ngetik ulang token.
(async function initAuth(){
  const t = getToken();
  if(!t) return;
  try{
    const res = await fetch('/api/admin/verify', { method:'POST', headers:{ 'x-admin-token': t } });
    const data = await res.json();
    if(res.ok && data.ok){ window.location.href = '/admin/panel.html'; } else { clearToken(); }
  }catch(e){ /* biarin di layar login kalau offline */ }
})();
</script>
</body>
</html>
