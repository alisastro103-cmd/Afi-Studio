    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; font-family: 'DM Sans', sans-serif; scroll-behavior: smooth; }
        h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; }

        :root {
            --accent: #93C5FD;
            --accent-hover: #7DD3FC;
            --bg: #D0D7E1;
            --surface: #E1E7EE;
            --text: #334155;
            --text-sub: #64748B;
            --border: #B9C4D3;
            --grid-line: rgba(100,116,139,0.22);
        }

        html.dark {
            --accent: #3B5578;
            --accent-hover: #4A6690;
            --bg: #1E293B;
            --surface: #334155;
            --text: #CBD5E1;
            --text-sub: #94A3B8;
            --border: #475569;
            --grid-line: rgba(148,163,184,0.16);
        }

        body { background: var(--bg); color: var(--text); transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; zoom: 0.75; }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: -1;
        }

        .nav-bar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 5px;
            margin-right: 10px;
        }

        /* Panel pencarian: melayang (floating) tepat di bawah navbar, TIDAK
           mendorong elemen lain dan TIDAK ikut bergeser sedikit pun saat
           halaman discroll — pakai position:fixed terhadap layar (bukan
           sticky), jadi posisinya benar-benar diam, cuma nempel di bawah
           navbar (var(--nav-h)). Layernya di atas konten, di bawah navbar
           (39 vs 40) + efek kaca (blur + transparan) + sudut membulat. */
        .search-container {
            position: fixed;
            left: 50%;
            top: calc(var(--nav-h, 56px) + 16px);
            width: calc(100% - 32px);
            max-width: 640px;
            z-index: 39;
            transform: translate(-50%, -14px) scale(0.97);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.3s;
        }
        .search-container.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translate(-50%, 0) scale(1);
        }

        .search-input { width: 100%; padding: 14px 18px 14px 48px; border-radius: 14px; background: color-mix(in srgb, var(--surface) 70%, transparent); border: 1px solid var(--border); color: var(--text); outline: none; font-size: 14px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(0,0,0,0.25); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .category-header {
            display: inline-flex;
            align-items: center;
            font-family: 'Outfit', sans-serif;
            background: var(--surface);
            padding: 8px 14px;
            border-radius: 3px;
        }

        /* Transisi masuk konten halaman, senada dengan halaman lain (member-Afi-Studio, Models) */
        main {
            opacity: 0;
            transform: translateY(10px);
            animation: section-fade-in 0.5s ease forwards;
        }
        @keyframes section-fade-in {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Kartu video muncul dengan efek slide-up + fade-in secara bertahap (staggered) */
        @keyframes cardRevealUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #content-grid .tutorial-card,
        #popular-grid .tutorial-card {
            animation: cardRevealUp 0.45s ease-out both;
        }

        /* Feed "Semua Video & Tutorial" dibuat grid 2-4 kolom yang wrap ke bawah
           (bukan scroll ke samping) -- discroll ke bawah kalau videonya banyak */
        .tutorial-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px 10px;
        }
        @media (min-width: 640px) {
            .tutorial-grid { grid-template-columns: repeat(3, 1fr); gap: 20px 14px; }
        }
        @media (min-width: 1024px) {
            .tutorial-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* "Baru saja dinonton" (riwayat nonton) tampil 1 baris, discroll ke samping,
           ukuran kartu tetap sama kayak video lain (nggak mengecil) */
        .recent-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scroll-snap-type: x proximity;
            padding: 2px 2px 6px;
        }
        .recent-scroll .tutorial-card { flex-shrink: 0; width: 264px; scroll-snap-align: start; }
        @media (min-width: 640px) {
            .recent-scroll { gap: 14px; }
            .recent-scroll .tutorial-card { width: 324px; }
        }
        @media (min-width: 1024px) {
            .recent-scroll .tutorial-card { width: 364px; }
        }

        .tutorial-card { cursor: pointer; width: 100%; }

        .tutorial-thumb-wrap {
            position: relative;
            overflow: hidden;
            background: var(--surface);
            border-radius: 10px;
        }
        .tutorial-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; transition: transform 0.25s; }
        .tutorial-card:hover .tutorial-thumb { transform: scale(1.03); }

        .tutorial-play-badge {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.15);
            transition: background 0.2s;
        }
        .tutorial-card:hover .tutorial-play-badge { background: rgba(0,0,0,0.3); }
        .tutorial-play-badge svg { width: 56px; height: 56px; color: #fff; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }

        /* Badge "Baru" - muncul otomatis kalau field `added` di videos.json masih baru */
        .new-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #EF4444;
            color: #fff;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 999px;
            z-index: 2;
            letter-spacing: 0.02em;
        }

        /* Pil kecil penunjuk jumlah tontonan (localStorage, per-device) */
        .view-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 16px 0;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
        }
        @media (min-width: 640px) {
            .view-badge { padding: 1px 0 0; }
        }

        .tutorial-card-title {
            padding: 10px 16px 0;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.35;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        @media (min-width: 640px) {
            .tutorial-card-title { padding: 8px 0 0; }
        }

        /* Modal Styling (player video) */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; backdrop-filter: blur(4px); }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; max-width: 480px; width: 92%; overflow: hidden; transform: scale(0.92); transition: transform 0.25s; }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .video-modal-box { max-width: 760px; width: 94%; border-radius: 3px !important; position: relative; }
        .video-frame-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }

        /* Tombol bintang favorit - nempel di ujung board popup video */
        .modal-fav-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 5;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.45);
            border: none;
            cursor: pointer;
            color: #fff;
            transition: background 0.2s, color 0.2s, transform 0.15s;
        }
        .modal-fav-btn:hover { background: rgba(0,0,0,0.65); }
        .modal-fav-btn:active { transform: scale(0.9); }
        .modal-fav-btn svg { width: 17px; height: 17px; }
        .modal-fav-btn.is-favorited { color: #FBBF24; }
        .video-frame-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
        .video-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .video-youtube-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }
        .video-youtube-btn:hover { background: var(--accent); color: #fff; }
        .video-youtube-btn:focus, .video-youtube-btn:focus-visible { outline: none; }
        .video-youtube-btn { -webkit-tap-highlight-color: transparent; }
        .video-youtube-btn svg { width: 16px; height: 16px; }

        .footer-text {
            text-align: center;
            font-size: 11px;
            color: var(--text-sub);
            padding: 16px 0 28px;
            font-weight: 500;
        }

        #theme-toggle-btn .icon-moon { display: none; }
        html.dark #theme-toggle-btn .icon-sun { display: none; }
        html.dark #theme-toggle-btn .icon-moon { display: block; }

        /* Menu pindah halaman */
        .page-menu { position: relative; }
        .page-menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 5px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .page-menu-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            min-width: 220px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 50;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-6px) scale(0.98);
            transform-origin: top right;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
        }
        .page-menu-dropdown.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }
        .page-menu-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; line-height: 1.15; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 13px; font-weight: 400; font-family: 'Outfit', sans-serif; }
        .page-menu-item .page-menu-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.75; }
        .page-menu-item:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
        .page-menu-item:active { opacity: 0.6; }
        .page-menu-item.active { color: var(--text); background: color-mix(in srgb, var(--accent) 10%, transparent); font-weight: 700; }
        html.dark .page-menu-item.active { color: #fff; }
        
        .page-menu-divider { height: 1px; background: var(--border); margin: 6px 4px; }
        .page-menu-item-cta { color: var(--text); display: flex; align-items: center; justify-content: flex-start; }
        html.dark .page-menu-item-cta { color: #fff; }
        .page-menu-item-cta:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
        .page-menu-item-cta:active { opacity: 0.6; }
    </style>

        }
        .toast-daftar.show { transform: translate(-50%, 0); }
    </style>
